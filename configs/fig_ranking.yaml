# Repair priority: rank agreement and decision value of each scoring rule,
# as a function of the price kappa [kWh per K h] of the service deficit.
# A portfolio holds `portfolio_size` diagnosed faults, each a different fault
# case in a different week (independent plants); the planner repairs `capacity`.
seed: 0
kappas: [0, 1, 3, 10, 30, 70, 100, 300, 700]
reference_kappas: [0, 10, 70, 700]   # numbers quoted in the text
table_kappas: [0, 70]
portfolio_size: 5
capacity: 1
portfolios: 20000
variants: [[5, 2], [10, 1], [10, 3]]   # (size, capacity) reported in the text
bootstrap: {replicates: 500, portfolios: 5000}   # weeks resampled with replacement
decisions_per_year: 52       # one repair decision per week
price_eur_per_kwh: 0.20      # illustrative electricity price for the annual value
